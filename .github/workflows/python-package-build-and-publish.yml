name: Python package build and publish

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'dependabot/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Set version
        id: set-version
        run: |
          VERSION=$(grep '^version =' pyproject.toml | cut -d '"' -f2)
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            VERSION=$VERSION
          else
            VERSION=${VERSION}.dev$(date +%s)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update version in pyproject.toml
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ steps.set-version.outputs.version }}\"/" pyproject.toml

      - name: Create venv and install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Install pip-licenses in system Python
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pip-licenses

      - name: Run license check script
        run: |
          python3 scripts/check_licenses.py --target-python .venv/bin/python

      - name: Build package
        run: |
          .venv/bin/python -m build

      - name: Run tests
        run: |
          .venv/bin/python -m pytest

      - name: Commit and push generated files
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add requirements.txt THIRD-PARTY-LICENSES.md
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update requirements.txt and THIRD-PARTY-LICENSES.md"
            git push origin ${{ github.ref }}
          else
            echo "No changes to commit"
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jeap-pipeline
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-to-testpypi:
    if: github.ref != 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/jeap-pipeline
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
