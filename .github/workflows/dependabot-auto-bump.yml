name: Dependabot auto version bump

on:
  pull_request:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump minor version
        id: bump
        run: |
          set -euo pipefail
          CURRENT=$(grep '^version =' pyproject.toml | cut -d '"' -f2)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          NEW="${MAJOR}.$((MINOR + 1)).0"
          TODAY=$(date +%Y-%m-%d)
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "new=$NEW" >> $GITHUB_OUTPUT
          echo "today=$TODAY" >> $GITHUB_OUTPUT

          sed -i "s/^version = \".*\"/version = \"${NEW}\"/" pyproject.toml

          sed -i "s/^softwareVersion: .*/softwareVersion: ${NEW}/" publiccode.yml
          sed -i "s/^releaseDate: .*/releaseDate: ${TODAY}/" publiccode.yml

          awk -v ver="$NEW" -v date="$TODAY" '
            BEGIN { inserted = 0 }
            /^## \[/ && !inserted {
              print "## [" ver "] - " date "\n\n### Changed\n\n- Updated dependencies.\n"
              inserted = 1
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.new && mv CHANGELOG.md.new CHANGELOG.md

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml publiccode.yml CHANGELOG.md
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Bump version to ${{ steps.bump.outputs.new }}"
            git push
          fi
